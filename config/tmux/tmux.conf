# Caps Lock maps to Control in macOS; prefix is Caps Lock + A.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-prefix

set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty:RGB,xterm-256color:RGB'
set -g mouse on
set -g focus-events on
set -s escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g window-status-current-style 'none'

# New panes and windows retain the current directory.
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'
bind P new-window -n projects -c '#{pane_current_path}' 'env SHELL=/bin/sh /opt/homebrew/bin/tmux-manager'
bind Tab last-window
bind / display-popup -E -w 90% -h 85% -T ' tmux shortcuts | scroll: arrows | search: / | close: q ' 'sh ~/.config/tmux/show-cheatsheet.sh'
# A separate label survives fish/application updates to the terminal title.
bind u command-prompt -p 'Pane title (empty resets):' -I '#{@pane-label}' { set-option -p @pane-label '%%' }
# Temporary shell in the current directory; exit or Ctrl-d closes it.
bind C-p display-popup -E -w 85% -h 80% -d '#{pane_current_path}' -T ' Scratch terminal ' '/opt/homebrew/bin/fish'

# Trackpad scrolling enters scrollback. Drag selections copy to macOS.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy

# Cyan/purple accents match the Starship prompt.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#171b24,fg=#aab2c0'
set -g status-left-length 30
set -g status-right-length 50
set -g status-left '#[bg=cyan,fg=#171b24,bold] #S #[default] '
set -g status-right '#[fg=purple]#{?window_zoomed_flag, ZOOM ,}#[fg=cyan] %a %d %b #[fg=#aab2c0]%H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bg=purple,fg=#171b24,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#353b49'
set -g pane-active-border-style 'fg=cyan'
setw -g pane-border-status off
# Update the affected window when panes are split, closed, or moved.
set-hook -g window-layout-changed[90] { run-shell '~/.config/tmux/update-pane-titles.sh' }
set-hook -g after-split-window[90] { run-shell '~/.config/tmux/update-pane-titles.sh' }
set-hook -g after-kill-pane[90] { run-shell '~/.config/tmux/update-pane-titles.sh' }
run-shell '~/.config/tmux/update-pane-titles.sh'
setw -g pane-border-format ' #P: #{?@pane-label,#{@pane-label},#{pane_current_command}} '
set -g message-style 'bg=#171b24,fg=cyan'
setw -g mode-style 'bg=purple,fg=#171b24'

# BEGIN managed tmux plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'binara-sachin/tmux-ui-manager'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @manager-key 'e'
set -g @manager-confirm-kill 'on'
set -g @manager-color-bg '#171b24'
set -g @manager-color-text '#aab2c0'
set -g @manager-color-active '#00ffff'
set -g @manager-color-accent '#af00ff'
set -g @manager-color-border '#353b49'
set -g @manager-color-selection-bg '#353b49'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @open-S 'https://www.google.com/search?q='
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g status-right-length 70
set -g status-right '#[bg=cyan,fg=black]#{?client_prefix, PREFIX ,}#[bg=purple,fg=black]#{?client_prefix,,#{?pane_in_mode, COPY ,}}#[default] #[fg=purple]#{?window_zoomed_flag, ZOOM ,}#[fg=cyan] %a %d %b #[fg=#aab2c0]%H:%M '
# Keep Continuum last in the plugin list and TPM initialization last below.
run-shell '~/.tmux/plugins/tpm/tpm'
# END managed tmux plugins
