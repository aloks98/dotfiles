# Caps Lock maps to Control in macOS; prefix is Caps Lock + A.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-prefix

set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty:RGB,xterm-256color:RGB'
set -g mouse on
set -g focus-events on
set -s escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New panes and windows retain the current directory.
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Trackpad scrolling enters scrollback. Drag selections copy to macOS.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy

# Cyan/purple accents match the Starship prompt.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#171b24,fg=#aab2c0'
set -g status-left-length 30
set -g status-right-length 50
set -g status-left '#[bg=cyan,fg=#171b24,bold] #S #[default] '
set -g status-right '#[fg=purple]#{?window_zoomed_flag, ZOOM ,}#[fg=cyan] %a %d %b #[fg=#aab2c0]%H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bg=purple,fg=#171b24,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#353b49'
set -g pane-active-border-style 'fg=cyan'
set -g message-style 'bg=#171b24,fg=cyan'
setw -g mode-style 'bg=purple,fg=#171b24'
